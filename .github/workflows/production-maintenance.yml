name: Production Maintenance

on:
  schedule:
    # 22:00 UTC = 03:00 Asia/Tashkent
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_APP_URL: https://sharkteam.uz
      CRON_SECRET: ${{ secrets.PRODUCTION_CRON_SECRET }}

    steps:
      - name: Check scheduler configuration
        id: config
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "PRODUCTION_CRON_SECRET is not configured."
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Trigger maintenance
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          URL="${PRODUCTION_APP_URL%/}/api/jobs/maintenance"
          RESPONSE_FILE="$(mktemp)"

          HTTP_CODE=$(curl             --silent             --show-error             --location             --max-time 90             --output "$RESPONSE_FILE"             --write-out "%{http_code}"             --request POST             --header "Authorization: Bearer $CRON_SECRET"             "$URL")

          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Maintenance worker returned HTTP $HTTP_CODE"
            exit 1
          fi
