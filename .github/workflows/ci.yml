name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shark_team
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shark_team"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shark_team
      DATABASE_POOL_MAX: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYMENT_MODE: PAYME
      PAYME_MERCHANT_ID: ci-merchant
      PAYME_LOGIN: ci-login
      PAYME_KEY: ci-key
      PAYME_CHECKOUT_URL: https://test.paycom.uz
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-123
      ADMIN_SESSION_SECRET: ci-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      ADMIN_COOKIE_SECURE: "false"
      COACH_SESSION_SECRET: ci-coach-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      COACH_COOKIE_SECURE: "false"
      COACH_SMOKE_USERNAME: ci-coach
      COACH_SMOKE_PASSWORD: ci-coach-password-123
      TELEGRAM_BOT_TOKEN: ci-telegram-token
      TELEGRAM_BOT_USERNAME: shark_ci_bot
      TELEGRAM_WEBHOOK_SECRET: ci-telegram-webhook-secret
      CRON_SECRET: ci-cron-secret-0123456789abcdef
      TELEGRAM_DRY_RUN: "true"
      MEDIA_DRY_RUN: "true"
      TRIAL_REMINDER_MINUTES: "180"
      POST_TRIAL_FEEDBACK_MINUTES: "30"
      RATE_LIMIT_SALT: ci-rate-limit-salt-0123456789-abcdefghijklmnopqrstuvwxyz
      MAINTENANCE_SESSION_HORIZON_DAYS: "84"
      BLOB_READ_WRITE_TOKEN: ci-blob-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Scan repository for committed secrets
        run: npm run security:scan

      - name: Install dependencies
        run: npm install

      - name: Inspect production dependency reachability
        run: |
          npm ls --omit=dev deepmerge-ts mysql2 @prisma/config prisma || true

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify production environment contract
        run: npm run verify:production-env
        env:
          PRODUCTION_VERIFY_MODE: ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to CI database
        run: npm run db:migrate:deploy

      - name: Seed School 117
        run: npm run db:seed

      - name: Verify core data
        run: npm run db:verify

      - name: Generate deterministic test sessions
        run: npm run db:sessions
        env:
          SESSION_FROM: "2026-09-29"
          SESSION_TO: "2026-10-12"
          SESSION_BRANCH_ID: "BR-SCHOOL-117-01"

      - name: Verify generated sessions
        run: npm run db:verify-sessions

      - name: Verify session generation is idempotent
        run: |
          npm run db:sessions
          npm run db:verify-sessions
        env:
          SESSION_FROM: "2026-09-29"
          SESSION_TO: "2026-10-12"
          SESSION_BRANCH_ID: "BR-SCHOOL-117-01"

      - name: Prepare booking smoke data
        run: npm run db:prepare-booking-smoke

      - name: Verify trial hold windows
        run: npm run verify:hold-window

      - name: Prepare coach smoke data
        run: npm run db:prepare-coach-smoke

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          export MANUAL_PAYMENT_CARD_NUMBER="$(printf '1%.0s' {1..12})"
          export MANUAL_PAYMENT_CARD_HOLDER="CI Test"
          export TELEGRAM_ADMIN_CHAT_ID="-1001234567890"
          export TELEGRAM_ADMIN_USER_IDS="999001"
          npm start > /tmp/shark-next.log 2>&1 &
          echo $! > /tmp/shark-next.pid

      - name: Smoke test public RU/UZ pages
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/ru | grep -q "Баскетбол"
          curl -fsS http://127.0.0.1:3000/uz | grep -q "Basketbol"
          curl -fsS http://127.0.0.1:3000/ru/branches/school-117 | grep -q "Школа"
          curl -fsS http://127.0.0.1:3000/api/public/branches/school-117 | grep -q "BR-SCHOOL-117-01"
          curl -fsS http://127.0.0.1:3000/ru/trial | grep -q "Подберите"

      - name: Smoke test trial lead flow
        run: npm run smoke:booking

      - name: Smoke test atomic trial reservations
        run: npm run smoke:reservation-race

      - name: Verify expired hold frees capacity
        run: npm run verify:expired-hold

      - name: Smoke test manual card payment flow
        run: npm run smoke:manual-card
        env:
          TELEGRAM_ADMIN_CHAT_ID: "-1001234567890"
          TELEGRAM_ADMIN_USER_IDS: "999001"

      - name: Verify manual payment rejection and expiry
        run: npm run verify:manual-payment-states
        env:
          TELEGRAM_ADMIN_CHAT_ID: "-1001234567890"
          TELEGRAM_ADMIN_USER_IDS: "999001"

      - name: Smoke test Payme Merchant API
        run: npm run smoke:payme

      - name: Smoke test Telegram linking and notifications
        run: npm run smoke:telegram

      - name: Smoke test coach dashboard
        run: npm run smoke:coach
        env:
          TELEGRAM_ADMIN_CHAT_ID: "-1001234567890"
          TELEGRAM_ADMIN_USER_IDS: "999001"

      - name: Verify subscription renewal lifecycle
        run: npm run verify:subscription-lifecycle

      - name: Verify payment attention alerts
        run: npm run verify:payment-alerts
        env:
          TELEGRAM_ADMIN_CHAT_ID: "-1001234567890"
          TELEGRAM_ADMIN_USER_IDS: "999001"

      - name: Verify regular attendance workflow
        run: npm run verify:regular-attendance

      - name: Verify attendance risk alerts
        run: npm run verify:attendance-alerts

      - name: Verify student progress workflow
        run: npm run verify:student-progress

      - name: Verify progress overdue alerts
        run: npm run verify:progress-alerts

      - name: Smoke test student management
        run: npm run smoke:student-management

      - name: Smoke test group operations
        run: npm run smoke:group-operations

      - name: Smoke test operations dashboard
        run: npm run smoke:operations-dashboard

      - name: Smoke test protected CRM
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/admin)
          case "$STATUS" in
            303|307|308) ;;
            *)
              echo "Expected unauthenticated /admin to redirect, got HTTP $STATUS"
              exit 1
              ;;
          esac

          WRONG_STATUS=$(curl -s -o /dev/null -w "%{http_code}"             -H "Content-Type: application/json"             -d '{"username":"ci-admin","password":"wrong"}'             http://127.0.0.1:3000/api/admin/login)
          test "$WRONG_STATUS" = "401"

          LOGIN_STATUS=$(curl -s -o /tmp/admin-login.json -w "%{http_code}"             -c /tmp/admin-cookies.txt             -H "Content-Type: application/json"             -d '{"username":"ci-admin","password":"ci-admin-password-123"}'             http://127.0.0.1:3000/api/admin/login)
          test "$LOGIN_STATUS" = "200"
          grep -q '"ok":true' /tmp/admin-login.json

          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin | grep -q "Dashboard"
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin/leads | grep -q "Payme Parent"
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin/parents | grep -q "Payme Parent"
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin/children | grep -q "Payme Child"
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin/payments | grep -q "REFUNDED"
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin/attendance | grep -q "Посещаемость"
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin/progress | grep -q "Прогресс"

          curl -fsS -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt -X POST http://127.0.0.1:3000/api/admin/logout | grep -q '"ok":true'

          POST_LOGOUT_STATUS=$(curl -s -o /dev/null -w "%{http_code}"             -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin)
          case "$POST_LOGOUT_STATUS" in
            303|307|308) ;;
            *)
              echo "Expected logged-out /admin to redirect, got HTTP $POST_LOGOUT_STATUS"
              exit 1
              ;;
          esac

      - name: Smoke test admin CMS
        run: npm run smoke:admin-cms

      - name: Smoke test production hardening
        run: npm run smoke:production

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/shark-next.pid ]; then
            kill $(cat /tmp/shark-next.pid) || true
          fi
          cat /tmp/shark-next.log || true
