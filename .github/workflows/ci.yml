name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shark_team
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shark_team"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shark_team
      DATABASE_POOL_MAX: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYME_MERCHANT_ID: ci-merchant
      PAYME_LOGIN: ci-login
      PAYME_KEY: ci-key
      PAYME_CHECKOUT_URL: https://test.paycom.uz
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-password
      ADMIN_SESSION_SECRET: ci-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      ADMIN_COOKIE_SECURE: "false"
      COACH_SESSION_SECRET: ci-coach-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      COACH_COOKIE_SECURE: "false"
      COACH_SMOKE_USERNAME: ci-coach
      COACH_SMOKE_PASSWORD: ci-coach-password-123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to CI database
        run: npm run db:migrate:deploy

      - name: Seed School 117
        run: npm run db:seed

      - name: Verify core data
        run: npm run db:verify

      - name: Generate deterministic test sessions
        run: npm run db:sessions
        env:
          SESSION_FROM: "2026-09-29"
          SESSION_TO: "2026-10-12"
          SESSION_BRANCH_ID: "BR-SCHOOL-117-01"

      - name: Verify generated sessions
        run: npm run db:verify-sessions

      - name: Verify session generation is idempotent
        run: |
          npm run db:sessions
          npm run db:verify-sessions
        env:
          SESSION_FROM: "2026-09-29"
          SESSION_TO: "2026-10-12"
          SESSION_BRANCH_ID: "BR-SCHOOL-117-01"

      - name: Prepare booking smoke data
        run: npm run db:prepare-booking-smoke

      - name: Verify trial hold windows
        run: npm run verify:hold-window

      - name: Prepare coach smoke data
        run: npm run db:prepare-coach-smoke

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/shark-next.log 2>&1 &
          echo $! > /tmp/shark-next.pid

      - name: Smoke test public RU/UZ pages
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/ru | grep -q "Баскетбол"
          curl -fsS http://127.0.0.1:3000/uz | grep -q "Basketbol"
          curl -fsS http://127.0.0.1:3000/ru/branches/school-117 | grep -q "Школа"
          curl -fsS http://127.0.0.1:3000/api/public/branches/school-117 | grep -q "BR-SCHOOL-117-01"
          curl -fsS http://127.0.0.1:3000/ru/trial | grep -q "Подберите"

      - name: Smoke test trial lead flow
        run: npm run smoke:booking

      - name: Smoke test atomic trial reservations
        run: npm run smoke:reservation-race

      - name: Verify expired hold frees capacity
        run: npm run verify:expired-hold

      - name: Smoke test Payme Merchant API
        run: npm run smoke:payme

      - name: Smoke test coach dashboard
        run: npm run smoke:coach

      - name: Smoke test protected CRM
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/admin)
          case "$STATUS" in
            303|307|308) ;;
            *)
              echo "Expected unauthenticated /admin to redirect, got HTTP $STATUS"
              exit 1
              ;;
          esac

          WRONG_STATUS=$(curl -s -o /dev/null -w "%{http_code}"             -H "Content-Type: application/json"             -d '{"username":"ci-admin","password":"wrong"}'             http://127.0.0.1:3000/api/admin/login)
          test "$WRONG_STATUS" = "401"

          LOGIN_STATUS=$(curl -s -o /tmp/admin-login.json -w "%{http_code}"             -c /tmp/admin-cookies.txt             -H "Content-Type: application/json"             -d '{"username":"ci-admin","password":"ci-password"}'             http://127.0.0.1:3000/api/admin/login)
          test "$LOGIN_STATUS" = "200"
          grep -q '"ok":true' /tmp/admin-login.json

          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin | grep -q "Dashboard"
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin/leads | grep -q "Payme Parent"
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin/parents | grep -q "Payme Parent"
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin/children | grep -q "Payme Child"
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin/payments | grep -q "REFUNDED"

          curl -fsS -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt -X POST http://127.0.0.1:3000/api/admin/logout | grep -q '"ok":true'

          POST_LOGOUT_STATUS=$(curl -s -o /dev/null -w "%{http_code}"             -b /tmp/admin-cookies.txt http://127.0.0.1:3000/admin)
          case "$POST_LOGOUT_STATUS" in
            303|307|308) ;;
            *)
              echo "Expected logged-out /admin to redirect, got HTTP $POST_LOGOUT_STATUS"
              exit 1
              ;;
          esac

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/shark-next.pid ]; then
            kill $(cat /tmp/shark-next.pid) || true
          fi
          cat /tmp/shark-next.log || true
