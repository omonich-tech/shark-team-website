name: Production Notification Live Check

on:
  push:
    branches:
      - ops/notification-audit-20261003
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-notification-live-check
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_APP_URL: https://shark-team-website.vercel.app
      CRON_SECRET: ${{ secrets.PRODUCTION_CRON_SECRET }}

    steps:
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "PRODUCTION_CRON_SECRET is not configured."
            exit 1
          fi

      - name: Trigger notification worker
        shell: bash
        run: |
          set -euo pipefail
          URL="${PRODUCTION_APP_URL%/}/api/jobs/notifications"
          RESPONSE_FILE="$(mktemp)"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 45 \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$URL")

          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Notification worker returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Probe manual-card production configuration
        shell: bash
        run: |
          set -euo pipefail
          URL="${PRODUCTION_APP_URL%/}/api/public/payments/manual/init"
          RESPONSE_FILE="$(mktemp)"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"bookingId":"nonexistent-production-config-probe"}' \
            "$URL")

          BODY="$(cat "$RESPONSE_FILE")"
          echo "$BODY"

          if [ "$HTTP_CODE" = "400" ] && echo "$BODY" | grep -q '"BOOKING_NOT_FOUND"'; then
            echo "Manual-card configuration is present."
            exit 0
          fi

          echo "Unexpected manual-card configuration probe result: HTTP $HTTP_CODE"
          exit 1
