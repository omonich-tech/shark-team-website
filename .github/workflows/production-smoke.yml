name: Production Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}

    steps:
      - name: Resolve production URL
        shell: bash
        run: |
          if [ -z "$PRODUCTION_APP_URL" ]; then
            echo "PRODUCTION_APP_URL=https://sharkteam.uz" >> "$GITHUB_ENV"
            echo "Using canonical SHARK TEAM production domain."
          fi

      - name: Wait for database readiness
        shell: bash
        run: |
          BASE="${PRODUCTION_APP_URL%/}"

          for attempt in $(seq 1 30); do
            code=$(curl \
              --silent \
              --show-error \
              --location \
              --max-time 20 \
              --output /tmp/ready.json \
              --write-out "%{http_code}" \
              "$BASE/api/ready" || true)

            echo "Attempt $attempt: /api/ready -> HTTP $code"
            cat /tmp/ready.json 2>/dev/null || true
            echo

            if [ "$code" = "200" ]; then
              exit 0
            fi

            sleep 10
          done

          echo "Production database did not become ready within 5 minutes."
          exit 1

      - name: Verify public production endpoints
        shell: bash
        run: |
          BASE="${PRODUCTION_APP_URL%/}"

          check() {
            local path="$1"
            local expected="$2"
            local tmp
            tmp="$(mktemp)"

            code=$(curl \
              --silent \
              --show-error \
              --location \
              --max-time 45 \
              --output "$tmp" \
              --write-out "%{http_code}" \
              "$BASE$path")

            echo "$path -> HTTP $code"

            if [ "$code" != "$expected" ]; then
              cat "$tmp"
              exit 1
            fi
          }

          check "/api/health" "200"
          check "/api/ready" "200"
          check "/robots.txt" "200"
          check "/sitemap.xml" "200"
          check "/ru" "200"
          check "/uz" "200"
          check "/ru/branches" "200"

      - name: Verify canonical domain and SEO URLs
        shell: bash
        run: |
          set -euo pipefail

          ROBOTS="$(curl --silent --show-error --location --max-time 45 https://sharkteam.uz/robots.txt)"
          SITEMAP="$(curl --silent --show-error --location --max-time 45 https://sharkteam.uz/sitemap.xml)"

          echo "$ROBOTS" | grep -Fq "https://sharkteam.uz/sitemap.xml"
          echo "$SITEMAP" | grep -Fq "https://sharkteam.uz/ru"
          if echo "$SITEMAP" | grep -Fq "shark-team-website.vercel.app"; then
            echo "Sitemap still references the old Vercel domain."
            exit 1
          fi

          HEADERS="$(curl --silent --show-error --max-time 45 --head https://www.sharkteam.uz/)"
          echo "$HEADERS"

          echo "$HEADERS" | grep -Eq "^HTTP/[^ ]+ 308"
          echo "$HEADERS" | grep -Eiq "^location: https://sharkteam\.uz/?"


      - name: Verify private routes remain protected
        shell: bash
        run: |
          BASE="${PRODUCTION_APP_URL%/}"

          for path in /admin /coach; do
            code=$(curl \
              --silent \
              --show-error \
              --max-time 45 \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$BASE$path")

            case "$code" in
              302|303|307|308)
                echo "$path protected -> HTTP $code"
                ;;
              *)
                echo "$path should redirect to login but returned HTTP $code"
                exit 1
                ;;
            esac
          done
